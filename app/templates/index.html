<!DOCTYPE html>
<html>

<head>

    <title>Diabetes Prediction</title>

    <style>

        input[type=number] {
            width: 300px;
            padding: 10px;
            margin: 10px 0;
            font-size: 16px;
        }

        button {
            width: 310px;
            padding: 10px;
            font-size: 16px;
        }

        form {
            display: inline-block;
        }

    </style>

</head>


<body>

<center>

<h1>Diabetes Prediction</h1>


<form id="predictionForm">

    Pregnancies:
    <input
        type="number"
        name="pregnancies"
        value="4"
        required
    >
    <br>


    Glucose:
    <input
        type="number"
        name="glucose"
        value="121"
        required
    >
    <br>


    Blood Pressure:
    <input
        type="number"
        name="bloodPressure"
        value="69"
        required
    >
    <br>


    Skin Thickness:
    <input
        type="number"
        name="skinThickness"
        value="21"
        required
    >
    <br>


    Insulin:
    <input
        type="number"
        name="insulin"
        value="80"
        required
    >
    <br>


    BMI:
    <input
        type="number"
        name="bmi"
        value="32"
        step="0.1"
        required
    >
    <br>


    Diabetes Pedigree Function:
    <input
        type="number"
        name="diabetesPedigreeFunction"
        value="0.47"
        step="0.001"
        required
    >
    <br>


    Age:
    <input
        type="number"
        name="age"
        value="33"
        required
    >
    <br>


    <button type="submit">
        Predict
    </button>

</form>


<h2 id="predictionResult">
    Prediction:
</h2>

<h2 id="predictionProbability">
    Probability of Diabetes:
</h2>


</center>


<script>

document
.getElementById("predictionForm")
.addEventListener("submit", function(e) {

    e.preventDefault();

    var formData = new FormData(this);

    fetch("/predict", {
        method: "POST",
        body: formData
    })

    .then(response => response.json())

    .then(data => {

        document.getElementById("predictionResult")
        .textContent =
        "Prediction: " + data.prediction;

        document.getElementById("predictionProbability")
        .textContent =
        "Probability of Diabetes: "
        + (data.probability * 100).toFixed(2)
        + "%";

    })

    .catch(error => {

        console.error("Error:", error);

    });

});

</script>

</body>

</html>
